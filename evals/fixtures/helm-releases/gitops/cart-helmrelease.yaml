# Flux delivers the kg-cart release from the platform Helm repository.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cart, namespace: kg-helm}
spec:
  releaseName: kg-cart
  interval: 10m
  chart: {spec: {chart: kg-shop, version: "0.1.0", sourceRef: {kind: HelmRepository, name: platform}}}
  values:
    app: kg-cart
    image: registry.invalid/team/cart:2.0
