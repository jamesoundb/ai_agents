# .gitlab-ci.yml — checks for every merge request, and a GitLab Release for every vX.Y.Z tag.
# Each check is a script under tools/ci/, so developers can run exactly the same thing locally
# (see README "Contributing"). Release and rollback process: README "Versions and rollback".

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"   # merge request pipelines
    - if: $CI_COMMIT_TAG                                 # tag pipelines (releases)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS   # branch with an open MR: its MR pipeline covers it
      when: never
    - if: $CI_COMMIT_BRANCH                              # main, and branches without an MR yet

stages: [check, test, release]

variables:
  # Python image from Google's Docker Hub mirror instead of Docker Hub (same image digest; no Docker
  # Hub rate limits). The mirror is a cache, not a scanner: Google does not scan or patch it; the
  # image-scan job does. Point this at a company Artifact Registry remote repository if you have one.
  # slim-bookworm (Debian 12, security support to 2028): no fixable HIGH/CRITICAL vulnerabilities,
  # where the full python:3.12 image had 36, and 1/9 of the download. It has no git; every job
  # installs it from Debian (see default.before_script).
  # Pinned by digest, so a re-pushed tag cannot change what CI runs. To update a pin:
  # docker buildx imagetools inspect <image>:<tag>, then copy the top-level Digest line.
  PYTHON_IMAGE: mirror.gcr.io/library/python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  # Release tags: vMAJOR.MINOR.PATCH with an optional -suffix (v1.2.0, v1.3.0-rc.1)
  RELEASE_TAG_RE: '/^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'

default:
  image: $PYTHON_IMAGE         # Debian-based: has bash; skills need Python 3.10+
  interruptible: true          # a newer push to the same branch cancels the older pipeline
  # git from Debian's security-patched archive (the slim image has none). Jobs that set their own
  # before_script start it with *git-install.
  before_script:
    - &git-install apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null

# tree-sitter for code-graph/terraform-review/k8s-manifest-review, installed into the image's python3,
# which the skills' run.sh picks up. PyYAML is deliberately NOT pre-installed: k8s-rightsize's run.sh
# must install it itself, so every pipeline exercises the first-run path a new developer hits.
.python-deps:
  cache:
    key:
      prefix: pip-deps
      files: [skills/code-graph/scripts/requirements.txt, skills/k8s-rightsize/scripts/requirements.txt]
    paths: [.cache/pip]
  before_script:
    - *git-install
    - pip install --quiet -r skills/code-graph/scripts/requirements.txt

# Pinned lint tools, so a new ruff/shellcheck release cannot turn a green pipeline red by itself.
.lint-tools:
  cache:
    key: pip-lint
    paths: [.cache/pip]
  before_script:
    - *git-install
    - pip install --quiet ruff==0.16.8 shellcheck-py==0.11.0.1

# ---------------------------------------------------------------- check

repo-checks:
  stage: check
  cache:
    key: pip-repo-checks
    paths: [.cache/pip]
  before_script:
    # evals/validate.py parses YAML frontmatter (block scalars, lists, nested maps), so it needs a
    # real parser rather than a hand-rolled one. Pinned like the lint tools, so a PyYAML release
    # cannot turn this job red on its own. check_repo.py itself stays stdlib-only.
    - *git-install
    - pip install --quiet pyyaml==6.0.2
  script:
    - python3 tools/ci/check_repo.py      # frontmatter, agent->skill references, AGENTS.md in sync
    - python3 tools/ci/test_create_release.py   # the release job's API call, against a local stand-in
    # Structural check of the behavioral eval suite. Does NOT run the evals (that needs the
    # claude CLI and spends API credits) -- it catches malformed graders, uncompilable regexes
    # and missing fixtures before anyone pays for a run.
    - python3 evals/validate.py

lint:
  stage: check
  extends: .lint-tools
  script:
    # Blocking: only things that are broken (Python syntax errors and undefined names, shell errors).
    - ruff check --isolated --select E9,F63,F7,F82 --exclude skills/code-graph/tests/fixture .
    - shellcheck --severity=error $(tools/ci/shell_scripts.sh)

lint-advisory:
  stage: check
  extends: .lint-tools
  allow_failure: true                     # reported on the MR, never blocks; tighten over time
  script:
    - rc=0
    # Excluded on purpose, all deliberate style in this repo, and 900+ findings would keep the job
    # permanently yellow (which trains everyone to ignore it): E501 long lines, E702 compact
    # semicolon lines (argparse tables), E741 short names like `l` for label/line.
    - ruff check --isolated --select E,F,W,B --ignore E501,E702,E741 --exclude skills/code-graph/tests/fixture --statistics . || rc=1
    - shellcheck $(tools/ci/shell_scripts.sh) || rc=1
    - exit $rc

# Blocking Trivy scan (tools/ci/scan_images.sh): fixable HIGH and CRITICAL vulnerabilities in every
# digest-pinned image and in what the jobs install at start-up (git, the pip packages below).
# Set up like the other jobs first, so its own filesystem is what they run on.
image-scan:
  stage: check
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    - key: trivy-db
      paths: [.trivycache]
      when: always                        # keep the vulnerability database even when findings fail the job
    - key: pip-image-scan
      paths: [.cache/pip]
  before_script:
    - *git-install
    # Everything the other jobs pip-install, at the versions they install.
    - pip install --quiet -r skills/code-graph/scripts/requirements.txt -r skills/k8s-rightsize/scripts/requirements.txt ruff==0.16.8 shellcheck-py==0.11.0.1 pyyaml==6.0.2
  script:
    - sh tools/ci/scan_images.sh

# ---------------------------------------------------------------- test

engine-tests:
  stage: test
  extends: .python-deps
  script:
    - skills/ai-task/tests/run_tests.sh   # ai-task: workspace discovery, task lifecycle, refusals
    - skills/code-graph/tests/run_tests.sh   # code-graph regression suite (9-language fixture)
    - python3 skills/cluster-graph/tests/test_kubegraph.py   # cluster-graph: one test per troubleshooting case (minikube fixture)
    - python3 skills/gke-cost-discovery/tests/test_analyze.py   # gke-cost-discovery: reserved capacity; non-collect dirs refused
    - python3 skills/helm-chart-review/tests/test_helmreview.py   # helm-chart-review: HV004 secrets vs Secret references
    - python3 skills/k8s-manifest-review/tests/test_k8sreview.py   # k8s-manifest-review: YAML without a kind is not schema-validated

install-check:
  stage: test
  script:
    - tools/ci/install_check.sh              # project + user scope installs into temp dirs, uninstall

smoke:
  stage: test
  extends: .python-deps
  script:
    - tools/ci/smoke.sh                      # every skill script runs on fixtures / synthetic data

engine-setup:
  stage: test
  script:
    # run.sh --setup from an empty cache (venv, grammars), offline use when user namespaces exist,
    # uv when installed, the one-line message without write access, install.sh running the set-up
    - tools/ci/setup_check.sh

# ---------------------------------------------------------------- release (tags only)

release-notes:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG_RE
  variables:
    GIT_DEPTH: "0"                           # full history: notes list commits since the previous tag
  script:
    - git fetch --quiet --tags origin
    - tools/ci/release_notes.sh "$CI_COMMIT_TAG" > release-notes.md
    - cat release-notes.md
  artifacts:
    paths: [release-notes.md]
    expire_in: 1 week

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG_RE
  # Only release a tag whose checks all passed; release-notes also supplies the notes file.
  needs: [release-notes, repo-checks, lint, image-scan, engine-tests, install-check, smoke]
  script:
    # Releases API with CI_JOB_TOKEN, in the scanned default image (no separate glab image).
    - python3 tools/ci/create_release.py release-notes.md
