# Generated by k8s-guardrails. Sized as medium tier x expected concurrent build pods; raise it
# deliberately when demand grows instead of letting one namespace absorb the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: build-capacity
  namespace: {{namespace}}
  labels:
    app.kubernetes.io/managed-by: k8s-guardrails
spec:
  hard:
    requests.cpu: "{{quota_cpu}}"
    requests.memory: {{quota_mem}}
    limits.memory: {{quota_mem}}
    pods: "{{quota_pods}}"
    count/jobs.batch: "{{quota_jobs}}"
    persistentvolumeclaims: "0"
