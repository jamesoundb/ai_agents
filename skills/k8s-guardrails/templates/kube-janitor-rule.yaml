# Generated by k8s-guardrails. A rules-file entry for kube-janitor (https://codeberg.org/hjacobs/kube-janitor):
# objects in {{namespace}} that carry no janitor/ttl or janitor/expires annotation expire after {{ttl}}.
# Merge the `rules:` items into the ConfigMap that kube-janitor mounts (--rules-file); annotations on an
# object always win over rules, so a build can opt out with janitor/ttl: forever.
# Validate first: run kube-janitor with --dry-run and read its log for this namespace.
rules:
  - id: default-ttl-{{namespace}}
    resources:
      - deployments
      - statefulsets
      - jobs
    jmespath: "metadata.namespace == '{{namespace}}' && !contains(keys(metadata.annotations || `{}`), 'janitor/ttl') && !contains(keys(metadata.annotations || `{}`), 'janitor/expires')"
    ttl: {{ttl}}
