# Generated by k8s-guardrails: a namespace-scoped janitor that deletes Deployments, StatefulSets
# and Jobs whose age exceeds their `janitor/ttl` annotation (default {{ttl}} for objects without one
# in this namespace). Runs every 15 minutes with a least-privilege Role. Review before adopting;
# for cluster-wide use prefer kube-janitor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-env-janitor
  namespace: {{namespace}}
  labels:
    app.kubernetes.io/managed-by: k8s-guardrails
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-env-janitor
  namespace: {{namespace}}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-env-janitor
  namespace: {{namespace}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: test-env-janitor
subjects:
  - kind: ServiceAccount
    name: test-env-janitor
    namespace: {{namespace}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-env-janitor
  namespace: {{namespace}}
  labels:
    app: test-env-janitor
    app.kubernetes.io/managed-by: k8s-guardrails
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: test-env-janitor
        spec:
          serviceAccountName: test-env-janitor
          restartPolicy: Never
          containers:
            - name: janitor
              image: {{janitor_image}}
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 200m, memory: 64Mi}
              env:
                - {name: NAMESPACE, value: "{{namespace}}"}
                - {name: DEFAULT_TTL, value: "{{ttl}}"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  now=$(date +%s)
                  to_seconds() { v="$1"; n="${v%[hmd]}"; case "$v" in *h) echo $((n*3600));; *m) echo $((n*60));; *d) echo $((n*86400));; *) echo "$v";; esac; }
                  # GNU date and busybox date parse timestamps differently; support both
                  epoch() { date -d "$1" +%s 2>/dev/null || date -u -D %Y-%m-%dT%H:%M:%SZ -d "$1" +%s; }
                  for kind in deployment statefulset job; do
                    kubectl -n "$NAMESPACE" get "$kind" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.creationTimestamp}{"\t"}{.metadata.annotations.janitor/ttl}{"\n"}{end}' \
                    | while IFS="$(printf '\t')" read -r name created ttl; do
                        [ -n "$name" ] || continue
                        [ "$name" = "test-env-janitor" ] && continue
                        ttl="${ttl:-$DEFAULT_TTL}"; [ "$ttl" = "forever" ] && continue
                        age=$(( now - $(epoch "$created") ))
                        if [ "$age" -gt "$(to_seconds "$ttl")" ]; then
                          echo "deleting $kind/$name (age ${age}s > ttl $ttl)"; kubectl -n "$NAMESPACE" delete "$kind" "$name" --wait=false
                        fi
                      done
                  done
