# Generated by k8s-guardrails from build size tiers. Defaults apply to containers that set no
# requests/limits; max caps any single container at the "large" tier. Memory limit defaults equal
# the request (Guaranteed QoS, predictable bin packing). The default cpu limit is capped at 4x the
# default request so that maxLimitRequestRatio never rejects a pod that set nothing.
apiVersion: v1
kind: LimitRange
metadata:
  name: build-tiers
  namespace: {{namespace}}
  labels:
    app.kubernetes.io/managed-by: k8s-guardrails
  annotations:
    guardrails/small-tier: '{{small_tier_json}}'
    guardrails/medium-tier: '{{medium_tier_json}}'
    guardrails/large-tier: '{{large_tier_json}}'
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{small_cpu}}
        memory: {{small_mem}}
        ephemeral-storage: 4Gi
      default:
        cpu: {{default_cpu_limit}}
        memory: {{small_mem}}
        ephemeral-storage: 10Gi
      max:
        cpu: {{large_cpu}}
        memory: {{large_mem}}
        ephemeral-storage: 50Gi
      maxLimitRequestRatio:
        cpu: "4"
        memory: "1"
    - type: Pod
      max:
        cpu: {{large_cpu}}
        memory: {{large_mem}}
