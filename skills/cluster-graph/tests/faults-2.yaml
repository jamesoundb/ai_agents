# faults-2.yaml -- second set of planted cases (applied by plant.sh after faults.yaml): cost waste,
# NetworkPolicy reachability and a stuck rollout. Never apply this to a shared cluster.
apiVersion: v1
kind: Namespace
metadata: {name: kg-preview-123}
---
apiVersion: v1
kind: Namespace
metadata: {name: kg-net}
---
# ---------------------------------------------------------------- waste
# a test environment left up without janitor/ttl, over-requested for what it does
apiVersion: apps/v1
kind: Deployment
metadata: {name: preview-app, namespace: kg-preview-123}
spec:
  replicas: 2
  selector: {matchLabels: {app: preview-app}}
  template:
    metadata: {labels: {app: preview-app}}
    spec:
      containers:
        - {name: app, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
           resources: {requests: {cpu: 500m, memory: 512Mi}}}
---
# the same environment with a TTL: must not be listed
apiVersion: apps/v1
kind: Deployment
metadata: {name: preview-ttl, namespace: kg-preview-123, annotations: {janitor/ttl: 4h}}
spec:
  replicas: 1
  selector: {matchLabels: {app: preview-ttl}}
  template:
    metadata: {labels: {app: preview-ttl}}
    spec:
      containers:
        - {name: app, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
           resources: {requests: {cpu: 10m, memory: 16Mi}}}
---
# a disk nothing mounts (Bound by the default StorageClass)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: orphan-data, namespace: kg-preview-123}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
# a disk that is mounted: must not be listed
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: used-data, namespace: kg-preview-123}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: kg-preview-123, annotations: {janitor/ttl: 4h}}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - {name: db, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
           resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: [{name: data, mountPath: /data}]}
      volumes: [{name: data, persistentVolumeClaim: {claimName: used-data}}]
---
# a load balancer for a test environment (minikube never assigns it an address)
apiVersion: v1
kind: Service
metadata: {name: preview-lb, namespace: kg-preview-123}
spec: {type: LoadBalancer, selector: {app: preview-app}, ports: [{port: 80, targetPort: 8080}]}
---
# a finished Job kept forever (no ttlSecondsAfterFinished)
apiVersion: batch/v1
kind: Job
metadata: {name: seed-data, namespace: kg-preview-123}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers: [{name: seed, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sh", "-c", "echo seeded"],
                    resources: {requests: {cpu: 10m, memory: 16Mi}}}]
---
# scale-down blockers: a bare pod with local storage, a pod marked safe-to-evict=false, a PDB allowing nothing
apiVersion: v1
kind: Pod
metadata: {name: debug-shell, namespace: kg-preview-123, annotations: {janitor/ttl: 4h}}
spec:
  containers: [{name: sh, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
                resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: [{name: scratch, mountPath: /scratch}]}]
  volumes: [{name: scratch, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pinned, namespace: kg-preview-123, annotations: {janitor/ttl: 4h}}
spec:
  replicas: 1
  selector: {matchLabels: {app: pinned}}
  template:
    metadata: {labels: {app: pinned}, annotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
    spec:
      containers: [{name: app, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
                    resources: {requests: {cpu: 10m, memory: 16Mi}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: pinned, namespace: kg-preview-123}
spec: {minAvailable: 1, selector: {matchLabels: {app: pinned}}}
---
# ---------------------------------------------------------------- NetworkPolicy
# frontend -> api:8080 allowed; tester -> api denied; api -> db allowed but api's egress has no DNS rule
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: kg-net}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, tier: web}}
    spec:
      containers: [{name: web, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
                    resources: {requests: {cpu: 10m, memory: 16Mi}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tester, namespace: kg-net}
spec:
  replicas: 1
  selector: {matchLabels: {app: tester}}
  template:
    metadata: {labels: {app: tester}}
    spec:
      containers: [{name: sh, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
                    resources: {requests: {cpu: 10m, memory: 16Mi}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: kg-net}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - {name: api, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["httpd", "-f", "-p", "8080"],
           ports: [{name: http, containerPort: 8080}], resources: {requests: {cpu: 10m, memory: 16Mi}}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: kg-net}
spec: {selector: {app: api}, ports: [{port: 80, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: kg-net}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - {name: db, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["httpd", "-f", "-p", "5432"],
           ports: [{name: pg, containerPort: 5432}], resources: {requests: {cpu: 10m, memory: 16Mi}}}
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: kg-net}
spec: {selector: {app: db}, ports: [{port: 5432, targetPort: pg}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: kg-net}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-from-frontend, namespace: kg-net}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {tier: web}}}], ports: [{port: 8080}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: db-from-api, namespace: kg-net}
spec:
  podSelector: {matchLabels: {app: db}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: api}}}], ports: [{port: pg}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-egress, namespace: kg-net}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Egress]
  egress: [{to: [{podSelector: {matchLabels: {app: db}}}], ports: [{port: 5432}]}]
---
# ---------------------------------------------------------------- stuck rollout (revision 2 by plant.sh)
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: kg-faults}
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      containers:
        - {name: app, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"],
           resources: {requests: {cpu: 10m, memory: 16Mi}}}
