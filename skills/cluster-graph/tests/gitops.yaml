# gitops.yaml -- instances of the stand-in Argo CD and Flux kinds from faults-3.yaml (applied once their CRDs
# are Established). Status shapes follow Argo CD v2 (status.health, status.sync, status.resources) and Flux
# helm-controller v2 (status.conditions).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: shop, namespace: kg-gitops}
spec:
  project: default
  source: {repoURL: "https://git.example.test/platform/apps.git", path: charts/kg-shop, targetRevision: v2.0.0}
  destination: {server: "https://kubernetes.default.svc", namespace: kg-helm}
status:
  health: {status: Degraded, message: "Deployment kg-shop has not progressed"}
  sync: {status: Synced, revision: 3f9c2e1}
  resources:
    - {kind: Deployment, group: apps, version: v1, namespace: kg-helm, name: kg-shop, status: Synced,
       health: {status: Degraded, message: "Deployment \"kg-shop\" exceeded its progress deadline"}}
    - {kind: Service, version: v1, namespace: kg-helm, name: kg-shop, status: Synced, health: {status: Healthy}}
    - {kind: ConfigMap, version: v1, namespace: kg-helm, name: kg-shop-flags, status: OutOfSync, health: {status: Missing}}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cart, namespace: kg-helm}
spec:
  releaseName: kg-cart
  interval: 10m
  chart: {spec: {chart: kg-shop, version: "0.1.0", sourceRef: {kind: HelmRepository, name: platform}}}
status:
  observedGeneration: 1
  conditions:
    - {type: Ready, status: "False", reason: UpgradeFailed,
       message: "Helm upgrade failed for release kg-helm/kg-cart: another operation (install/upgrade/rollback) is in progress"}
    - {type: Released, status: "False", reason: UpgradeFailed, message: "another operation (install/upgrade/rollback) is in progress"}
